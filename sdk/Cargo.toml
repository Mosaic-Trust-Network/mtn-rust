[package]
name = "iop-sdk"
description = "Client SDK for the IOP Stack — re-exports the core crates in this workspace"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "iop_sdk"

[dependencies]
iop-keyvault = { workspace = true }
iop-vault = { workspace = true }
mosaic-did-types = { workspace = true }
json-digest = { workspace = true }

[features]
std = [ "iop-keyvault/std", "iop-vault/std", "mosaic-did-types/std" ]
