[package]
name = "mosaic-sdk"
description = "Client SDK for the Mosaic Trust Network — re-exports the core crates in this workspace"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "mosaic_sdk"

[dependencies]
mosaic-keyvault = { workspace = true }
mosaic-vault = { workspace = true }
mosaic-did-types = { workspace = true }
json-digest = { workspace = true }

[features]
std = [
	"mosaic-keyvault/std",
	"mosaic-vault/std",
	"json-digest/std",
	"mosaic-did-types/std",
]
