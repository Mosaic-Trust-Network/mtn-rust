[package]
name = "mosaic-sdk-wasm"
version = "2.0.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
mosaic-did-types = { workspace = true, features = ["substrate"] }
json-digest = { workspace = true }
parity-scale-codec = { workspace = true }
serde_json = { workspace = true }

[features]
default = [ "std" ]
std = [
	"json-digest/std",
	"mosaic-did-types/std",
	"parity-scale-codec/std",
	"serde_json/std",
]
