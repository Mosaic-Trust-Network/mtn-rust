[workspace]
resolver = "2"
members = [
    "json-digest",
    "keyvault",
    "mosaic-did-types",
    "pallet-mosaic-did",
    "sdk",
    "vault"
]

[workspace.package]
version = "0.1.0"
rust-version = "1.88"
edition = "2024"
repository = "https://github.com/Internet-of-People/iop-rs"
license = "LGPL-3.0-or-later"
homepage = "https://developer.iop.technology/glossary?id=multicipher"

[workspace.dependencies]
iop-keyvault = { version = "0.1.0", default-features = false }
iop-vault = { version = "0.1.0" }
json-digest = { version = "0.1.0" }
mosaic-did-types = { version = "0.1.0", default-features = false }
pallet-mosaic-did = { version = "0.1.0" }

android_logger = { version = "0.15.1" }
blake2 = { version = "0.10.6", default-features = false }
blake3 = { version = "1", default-features = false }
byteorder = { version = "1.5.0" }
digest = { version = "0.10.7", default-features = false, features = ["mac"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.1", default-features = false, features = ["wasm_js"]}
getrandom-2 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"]}
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hmac = { version = "0.12.1", default-features = false }
jni = { version = "0.21.1", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "arithmetic", "ecdsa"] }
multibase = { version = "0.9.1", default-features = false }
orion = { version = "0.17.11" }
parity-scale-codec = { version = "3", default-features = false, features = ["derive", "max-encoded-len"] }
parking_lot = { version = "0.12.4", features = ["serde"] }
polkadot-sdk = { version = "2512.3.3", git = "https://github.com/Mosaic-Chain/polkadot-sdk", branch = "private-address-range-2512-2", default-features = false }
rand = { version = "0.10.0", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
rmp-serde = { version = "1.3.0" }
scale-info = { version = "2", default-features = false, features = ["derive"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11.17", default-features = false, features = ["alloc"]}
serde_json = { version = "1.0.142", default-features = false, features = ["preserve_order", "alloc"] }
sha2 = { version = "0.10.9", default-features = false }
bip39 = { package = "tiny-bip39", version = "2.0.0", features = ["rand"], default-features = false }
typetag = { version = "0.2.20" }
thiserror = { version = "2", default-features = false }

# Experiment for optimizing WASM and FFI binary sizes
[profile.release]
lto = true
opt-level = 's'

[patch.crates-io]
core2 = { path = "./vendor/core2-0.4.0" }
iop-keyvault = { path = "./keyvault" }
iop-vault = { path = "./vault" }
json-digest = { path = "./json-digest" }
mosaic-did-types = { path="./mosaic-did-types" }
pallet-mosaic-did = { path="./pallet-mosaic-did" }
