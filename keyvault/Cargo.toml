[package]
name = "iop-keyvault"
description = "A general-purpose hierarchical deterministic generator for asymmetric keys."
keywords = ["crypto", "wallet", "iop", "vault", "ssi"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
blake2 = { workspace = true }
blake3 = { workspace = true }
digest = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
getrandom-2 = { workspace = true, optional = true }
hex = { workspace = true }
hmac = { workspace = true }
# Unfortunately the crate name of the libsecp256k1 collides with the perfect module name
# for the cipher, so we rename the dependency here:
secp = { workspace = true }
multibase = { workspace = true }
orion = { workspace = true, optional = true }
ripemd = { workspace = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
sha2 = { workspace = true }
tiny-bip39 = { workspace = true, default-features = false, features = ["default-langs"], optional = true }

[dev-dependencies]
rmp-serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["std"]
std = [
    "anyhow/std",
    "rand",
    "hex/std",
    "getrandom/std",
    "dep:tiny-bip39",
    "dep:orion",
    "dep:getrandom",
    "dep:getrandom-2",
]
serde = ["std", "dep:serde", "dep:serde_bytes"]
