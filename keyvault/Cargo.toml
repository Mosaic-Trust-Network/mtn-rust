[package]
name = "iop-keyvault"
description = "A general-purpose hierarchical deterministic generator for asymmetric keys."
keywords = ["crypto", "wallet", "iop", "vault", "ssi"]
categories = ["cryptography", "cryptography::cryptocurrencies"]

version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { workspace = true }
blake2 = { workspace = true }
blake3 = { workspace = true }
digest = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
getrandom-2 = { workspace = true, optional = true }
hex = { workspace = true }
hmac = { workspace = true }
k256 = { workspace = true }
multibase = { workspace = true }
orion = { workspace = true, optional = true }
ripemd = { workspace = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
sha2 = { workspace = true }
bip39 = { workspace = true, default-features = false, features = ["default-langs"], optional = true }
parity-scale-codec = { workspace = true, optional = true }
scale-info = { workspace = true, optional = true }

[dev-dependencies]
rmp-serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = [ "std" ]
std = [
	"dep:bip39",
	"dep:getrandom",
	"dep:getrandom-2",
	"dep:orion",
	"getrandom/std",
	"hex/std",
	"parity-scale-codec?/std",
	"rand",
	"scale-info?/std",
	"thiserror/std",
]
serde = [ "dep:serde", "dep:serde_bytes", "std" ]
substrate = [ "dep:parity-scale-codec", "dep:scale-info" ]
