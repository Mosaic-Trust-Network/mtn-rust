[package]
name = "pallet-mosaic-did"
description = "Substrate pallet for DID management on the Mosaic Trust Network (did:mosaic)"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mosaic-did-types = { workspace = true, features = ["substrate"] }
iop-keyvault = { workspace = true }

polkadot-sdk = { workspace = true, default-features = false, features = ["sp-std", "sp-runtime", "frame-system", "frame-support"] }

parity-scale-codec = { workspace = true }
scale-info = { workspace = true }

[dev-dependencies]
polkadot-sdk = { workspace = true, default-features = false, features = ["sp-io", "sp-core"] }
serde_json = { workspace = true }

[features]
default = [ "std" ]
std = [
	"iop-keyvault/std",
	"mosaic-did-types/std",
	"parity-scale-codec/std",
	"polkadot-sdk/std",
	"scale-info/std",
]

runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
	"polkadot-sdk/sp-core",
	"polkadot-sdk/sp-io",
]

try-runtime = [ "polkadot-sdk/try-runtime" ]
