[package]
name = "pallet-mosaic-did"
description = "Substrate pallet for DID management on the Mosaic Trust Network (did:mosaic)"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mosaic-did-types = { workspace = true, features = ["substrate"] }

# Substrate dependencies
frame-support = { version = "37", default-features = false }
frame-system = { version = "37", default-features = false }
parity-scale-codec = { version = "3", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
sp-runtime = { version = "39", default-features = false }
sp-std = { version = "14", default-features = false }

[dev-dependencies]
sp-core = { version = "34" }
sp-io = { version = "38" }

[features]
default = ["std"]
std = [
    "mosaic-did-types/std",
    "frame-support/std",
    "frame-system/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-runtime/std",
    "sp-std/std",
]

try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
