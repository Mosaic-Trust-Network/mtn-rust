[package]
name = "mosaic-did-types"
description = "Core type definitions for the did:mosaic DID method on the Mosaic Trust Network"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = { workspace = true }

bounded-collections = { version = "0.3", default-features = false, features = ["serde"] }

# Optional scale serialization
parity-scale-codec = { workspace = true, optional = true }
scale-info = { workspace = true, optional = true }

# Serde serialization (required for DidDocument service_endpoint and hash computation)
serde = { workspace = true }
serde_json = { workspace = true }

# IOP reuse (keyvault crypto is blockchain-agnostic)
iop-keyvault = { workspace = true, features = ["serde"] }

json-digest = { workspace = true }
multibase = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = [ "std" ]
std = [
	"blake3/std",
	"bounded-collections/std",
	"bs58/std",
	"hex/std",
	"iop-keyvault/std",
	"json-digest/std",
	"parity-scale-codec?/std",
	"scale-info?/std",
	"serde/std",
	"serde_json/std",
]
serde = []
substrate = [
	"iop-keyvault/substrate",
	"json-digest/substrate",
	"parity-scale-codec",
	"scale-info",
]
