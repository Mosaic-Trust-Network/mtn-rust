[package]
name = "mosaic-did-types"
description = "Core type definitions for the did:mosaic DID method on the Mosaic Trust Network"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Substrate SCALE codec — optional, enabled with "substrate" feature
parity-scale-codec = { workspace = true, optional = true }
scale-info = { workspace = true, optional = true }

# Bounded collections for on-chain types — optional, enabled with "substrate" feature.
# This is the same crate that frame-support/sp-runtime re-export, so types are
# fully compatible with pallet code without any adapters.
bounded-collections = { version = "0.2.4", default-features = false, optional = true }

# IOP reuse (keyvault crypto is blockchain-agnostic)
iop-keyvault.workspace = true

[dev-dependencies]
anyhow ={ workspace = true }

[features]
default = ["std"]
std = [
    "blake3/std",
    "bs58/std",
    "hex/std",
    "serde/std",
    "serde_json/std",
    "parity-scale-codec?/std",
    "scale-info?/std",
    "bounded-collections?/std",
]
substrate = ["parity-scale-codec", "scale-info", "bounded-collections"]
