[package]
name = "mosaic-did-types"
description = "Core type definitions for the did:mosaic DID method on the Mosaic Trust Network"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = { workspace = true }

# Same version that frame-support / sp-runtime re-export.
bounded-collections = { version = "0.2.4", default-features = false }

# Optional scale serialization
parity-scale-codec = { workspace = true, optional = true }
scale-info = { workspace = true, optional = true }

# Optional serde serialization
serde = { workspace = true, optional = true }

# IOP reuse (keyvault crypto is blockchain-agnostic)
iop-keyvault.workspace = true

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["std", "serde"]
std = [
    "blake3/std",
    "bs58/std",
    "hex/std",
    "bounded-collections/std",
    "parity-scale-codec?/std",
    "scale-info?/std",
    "serde?/std",
]
serde = ["dep:serde", "bounded-collections/serde"]
substrate = ["parity-scale-codec", "scale-info"]