[advisories]
version = 2
yanked = "warn"
ignore = [
    "RUSTSEC-2022-0061", # `parity-wasm` is deprecated 🤦
    "RUSTSEC-2024-0436", # `paste` is unmaintained
    "RUSTSEC-2024-0370", # `proc-macro-error` is unmaintained
    "RUSTSEC-2025-0055", # `tracing-subscriber` pinned to =0.3.19 by polkadot-sdk; 0.3.20 has an ANSI colour-code regression (tokio-rs/tracing#3378)
    "RUSTSEC-2025-0161", # `libsecp256k1` still arrives via polkadot-sdk/sp-core; keyvault uses k256
    "RUSTSEC-2026-0387", # `crypto-bigint` 0.5.5 via `k256`/`p256` 0.13 (alloy, revm, sp-core); fixed only in 0.7.6, no compatible 0.5.x patch
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "LGPL-3.0-or-later",
    # "LGPL-3.0",
    "MIT",
    "Unicode-3.0",
    "Zlib"
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "array-bytes"
version = "*"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "proc-macro-warning"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    # polkadot-sdk still pins old RustCrypto stack
    { name = "base16ct" },
    { name = "blake2" },
    { name = "const-oid" },
    { name = "crypto-bigint" },
    { name = "crypto-common" },
    { name = "curve25519-dalek" },
    { name = "der" },
    { name = "ecdsa" },
    { name = "ed25519" },
    { name = "ed25519-dalek" },
    { name = "elliptic-curve" },
    { name = "ff" },
    { name = "group" },
    { name = "hmac" },
    { name = "k256" },
    { name = "rfc6979" },
    { name = "sec1" },
    { name = "signature" },
    { name = "spki" },
    # pre-existing duplicates
    { name = "bitflags" },
    { name = "block-buffer" },
    { name = "cpufeatures" },
    { name = "digest" },
    { name = "fiat-crypto" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "r-efi" },
    { name = "rand" },
    { name = "rand_core" },
    { name = "sha2" },
    { name = "syn" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "toml_edit" },
    { name = "toml_datetime" },
]
skip-tree = [
    # duplicate mess
    {name = "windows-sys"},
]

[bans.workspace-dependencies]
duplicates = 'deny'
include-path-dependencies = true
unused = 'deny'

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Mosaic-Chain/polkadot-sdk?branch=private-address-range-2606-1"]

[sources.allow-org]
#github = ["wigy_opensource_developer"]
#gitlab = [""]
#bitbucket = [""]
