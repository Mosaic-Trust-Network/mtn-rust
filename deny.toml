[advisories]
version = 2
yanked = "warn"
ignore = [
    "RUSTSEC-2022-0061", # `parity-wasm` is deprecated 🤦
    "RUSTSEC-2024-0436", # `paste` is unmaintained
    "RUSTSEC-2024-0370", # `proc-macro-error` is unmaintained
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "LGPL-3.0-or-later",
    # "LGPL-3.0",
    "MIT",
    "Unicode-3.0",
    "Zlib"
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "array-bytes"
version = "*"
expression = "Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "proc-macro-warning"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    #duplicates
    { name = "base64" },
    { name = "bitflags" },
    { name = "block-buffer" },
    { name = "cpufeatures" },
    { name = "digest" },
    { name = "erased-serde" },
    { name = "fiat-crypto" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "hmac" },
    { name = "itertools" },
    { name = "r-efi" },
    { name = "rand" },
    { name = "rand_core" },
    { name = "sha2" },
    { name = "syn" },
    { name = "toml_edit" },
    { name = "toml_datetime" },
]
skip-tree = [
    # duplicate mess
    {name = "windows-sys"},
]

[bans.workspace-dependencies]
duplicates = 'deny'
include-path-dependencies = true
unused = 'deny'

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Mosaic-Chain/polkadot-sdk?branch=private-address-range-2512-2"]

[sources.allow-org]
#github = ["wigy_opensource_developer"]
#gitlab = [""]
#bitbucket = [""]
