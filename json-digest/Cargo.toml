[package]
name = "json-digest"
description = "Allow selective masking of JSON subdocuments for privacy, preserving the digest of the whole document."
keywords = ["crypto", "privacy", "json", "digest", "mosaic"]
categories = ["cryptography", "algorithms"]

version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { workspace = true }
blake3 = { workspace = true }
multibase = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-keccak = { version = "2.0.2", features = ["sha3"] }
unicode-normalization = { version = "0.1.22", default-features = false }

# Optional SCALE codec support for Substrate integration
parity-scale-codec = { workspace = true, optional = true }
scale-info = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }

[features]
default = [ "std" ]
std = [ "rand/thread_rng", "unicode-normalization/std" ]
substrate = [ "dep:parity-scale-codec", "dep:scale-info" ]
