# Thanks to the following blog post we are caching cargo
# http://blog.wjlr.org.uk/2016/08/16/fast-rust-gitlab-ci.html

# This file is a template, and might need editing before it works on your project.
image: "rust:1.88-bookworm"

# To ensure that dependencies are cached correctly
variables:
  CARGO_HOME: $CI_PROJECT_DIR/cargo

# Use cargo to test the project
test:cargo:
  before_script:
    - >
      ./.agents/scripts/verify-agents-symlink.sh ../agents
    - apt-get update
    # - apt-get install -y packagename
  script:
    - du -hs target || true
    - du -hs cargo || true
    - rustc --version && cargo --version # Print version info for debugging
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall --no-discover-github-token --disable-telemetry -y cargo-deny
    - export RUST_BACKTRACE=1
    - time cargo update
    - time cargo deny check
    - time cargo build --workspace --all-targets --verbose # --all-targets builds bin,lib,examples,tests,benchmarks
    # cargo fmt fails if modules generated by build.rs are not there yet
    - time cargo fmt -- --check
    - time cargo clippy --workspace --all-targets
    - time cargo test --workspace --verbose --jobs 1 # Don't parallelize to make errors more readable
  cache:
    paths:
      - target/
      - cargo/
