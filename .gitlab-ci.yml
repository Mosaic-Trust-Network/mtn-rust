image: "rust:1.91.0-bookworm"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/cargo

test:cargo:
  before_script:
    - export PATH=$CARGO_HOME/bin:$PATH
    - apt-get update
    - rustc --version && cargo --version
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall --no-discover-github-token --disable-telemetry -y cargo-deny zepter
    - export RUST_BACKTRACE=1
    - time cargo update
    - du -hs target || true
    - du -hs cargo || true
  script:
    - ./scripts/check.sh format
    - ./scripts/check.sh propagate
    - ./scripts/check.sh fmt
    - ./scripts/check.sh deny
    - ./scripts/check.sh clippy
    - ./scripts/check.sh test
    - ./scripts/check.sh nostd
  cache:
    paths:
      - target/
      - cargo/
